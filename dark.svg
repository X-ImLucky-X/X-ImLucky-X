<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Lakshya Kumar Singh — profile.sh --live">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADB5"/>
      <stop offset="50%" stop-color="#00FFF5"/>
      <stop offset="100%" stop-color="#393E46"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1E24"/>
      <stop offset="100%" stop-color="#222831"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Container -->
  <rect x="2" y="2" width="1176" height="316" rx="14" fill="#151921" stroke="#00ADB5" stroke-width="1.5" opacity="0.95"/>
  <rect x="6" y="6" width="1168" height="308" rx="10" fill="url(#panelGrad)"/>

  <!-- Terminal Top Bar -->
  <rect x="6" y="6" width="1168" height="42" rx="10" fill="#181D24"/>
  <line x1="6" y1="48" x2="1174" y2="48" stroke="#393E46" stroke-width="1"/>
  
  <!-- Window Buttons -->
  <circle cx="30" cy="27" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="27" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="27" r="6" fill="#27C93F"/>
  <text x="590" y="31" text-anchor="middle" font-size="13" fill="#EEEEEE" opacity="0.7">lakshyakumarsingh1@gmail.com — ./profile.sh --live</text>

  <!-- Title / Name -->
  <text x="50" y="110" font-size="38" font-weight="bold" fill="url(#glow)" filter="url(#glow3)">Lakshya Kumar Singh</text>
  <text x="50" y="145" font-size="18" fill="#EEEEEE" opacity="0.9">AI Engineer  |  Systems Builder  |  Full Stack Developer</text>

  <!-- Terminal Content Lines -->
  <g font-size="14" fill="#EEEEEE" opacity="0.85">
    <text x="50" y="195"><tspan fill="#00ADB5">$</tspan> status --current</text>
    <text x="70" y="220" fill="#00FFF5">➜ B.Tech CSE (AI Specialization) @ VIT Chennai · Final Year</text>
    <text x="50" y="255"><tspan fill="#00ADB5">$</tspan> focus --core</text>
    <text x="70" y="280" fill="#EEEEEE">➜ Local LLMs · Agentic Workflows (LangGraph/Ollama) · High-Performance C++ · Full Stack (FastAPI/React Native)</text>
  </g>

  <!-- Right Decorative Badge -->
  <rect x="940" y="80" width="190" height="200" rx="12" fill="#151921" stroke="#00ADB5" stroke-width="1" opacity="0.6"/>
  <text x="1035" y="130" text-anchor="middle" font-size="12" fill="#00ADB5" font-weight="bold">SYSTEM ACTIVE</text>
  <text x="1035" y="170" text-anchor="middle" font-size="32">⚡</text>
  <text x="1035" y="210" text-anchor="middle" font-size="12" fill="#EEEEEE">200+ LeetCode</text>
  <text x="1035" y="235" text-anchor="middle" font-size="11" fill="#00FFF5">VIT CHENNAI</text>
</svg>
