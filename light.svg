<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Lakshya Kumar Singh — profile.sh --live">
  <defs>
    <linearGradient id="glowLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007A80"/>
      <stop offset="50%" stop-color="#00ADB5"/>
      <stop offset="100%" stop-color="#222831"/>
    </linearGradient>
    <linearGradient id="panelGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6F8"/>
    </linearGradient>
  </defs>

  <!-- Outer Container -->
  <rect x="2" y="2" width="1176" height="316" rx="14" fill="#FFFFFF" stroke="#00ADB5" stroke-width="1.5"/>
  <rect x="6" y="6" width="1168" height="308" rx="10" fill="url(#panelGradLight)"/>

  <!-- Terminal Top Bar -->
  <rect x="6" y="6" width="1168" height="42" rx="10" fill="#EAEFEF"/>
  <line x1="6" y1="48" x2="1174" y2="48" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Window Buttons -->
  <circle cx="30" cy="27" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="27" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="27" r="6" fill="#27C93F"/>
  <text x="590" y="31" text-anchor="middle" font-size="13" fill="#333333">lakshyakumarsingh1@gmail.com — ./profile.sh --live</text>

  <!-- Title / Name -->
  <text x="50" y="110" font-size="38" font-weight="bold" fill="url(#glowLight)">Lakshya Kumar Singh</text>
  <text x="50" y="145" font-size="18" fill="#222831">AI Engineer  |  Systems Builder  |  Full Stack Developer</text>

  <!-- Terminal Content Lines -->
  <g font-size="14" fill="#222831">
    <text x="50" y="195"><tspan fill="#007A80">$</tspan> status --current</text>
    <text x="70" y="220" fill="#007A80">➜ B.Tech CSE (AI Specialization) @ VIT Chennai · Final Year</text>
    <text x="50" y="255"><tspan fill="#007A80">$</tspan> focus --core</text>
    <text x="70" y="280" fill="#333333">➜ Local LLMs · Agentic Workflows (LangGraph/Ollama) · High-Performance C++ · Full Stack (FastAPI/React Native)</text>
  </g>

  <!-- Right Decorative Badge -->
  <rect x="940" y="80" width="190" height="200" rx="12" fill="#F0F4F5" stroke="#00ADB5" stroke-width="1"/>
  <text x="1035" y="130" text-anchor="middle" font-size="12" fill="#007A80" font-weight="bold">SYSTEM ACTIVE</text>
  <text x="1035" y="170" text-anchor="middle" font-size="32">⚡</text>
  <text x="1035" y="210" text-anchor="middle" font-size="12" fill="#222831">200+ LeetCode</text>
  <text x="1035" y="235" text-anchor="middle" font-size="11" fill="#007A80">VIT CHENNAI</text>
</svg>
